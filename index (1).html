<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Moonfall</title>
<style>
:root{color-scheme:dark;--bg:#0d0b14;--panel:#1a1626;--line:#3a3350;--tx:#ece8f6;--mut:#a59fbd;--acc:#8f86ff;--ok:#5cc28a;--bad:#e2574c;
--C:#8f86ff;--E:#ff7a45;--H:#ff6fa3;--S:#2fc29a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:var(--tx);background:#2a2440;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#120f1f;font-weight:600}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;color:var(--tx);background:#120f1c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.scr{display:none;min-height:100%;padding:24px 16px}
.scr.on{display:block}
.card{max-width:520px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{font-size:30px;margin:0 0 4px;letter-spacing:.5px}
h2{font-size:18px;margin:18px 0 8px}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;background:#15111f}
.role b{display:block;font-size:16px}
.role small{color:var(--mut);display:block;line-height:1.3;margin-top:2px}
.role.mine{border-color:var(--acc);background:#211b36}
.code{font:700 34px/1 ui-monospace,monospace;letter-spacing:6px;color:var(--acc)}
#game{position:fixed;inset:0;display:none}
#game.on{display:block}
#views{position:absolute;inset:0}
#views.quad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#000}
#views canvas{width:100%;height:100%;display:block;touch-action:none}
#topbar{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;z-index:5;pointer-events:none;scrollbar-width:none}
#topbar::-webkit-scrollbar{display:none}
#topbar.client{justify-content:center;left:auto;right:50%;transform:translateX(50%)}
#topbar button{flex:0 0 auto}
#topbar button{pointer-events:auto;padding:6px 10px;font-size:13px;border-radius:8px;background:rgba(26,22,38,.85)}
#topbar button.sel{background:var(--acc);color:#120f1f;border-color:var(--acc)}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:96px;width:min(560px,92%);z-index:6;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:rgba(26,22,38,.94);border:1px solid var(--line);border-left:4px solid var(--acc);padding:8px 12px;border-radius:8px;font-size:14px;max-width:100%}
#chat{position:absolute;left:8px;bottom:8px;width:min(340px,60%);z-index:6;display:flex;flex-direction:column;gap:4px}
#chatlog{display:flex;flex-direction:column;gap:3px;max-height:30vh;overflow:hidden;justify-content:flex-end}
#chatlog div{background:rgba(13,11,20,.8);padding:4px 8px;border-radius:6px;font-size:13px}
#chatin{display:none;gap:6px}
#chatin.on{display:flex}
#chatin input{padding:6px 10px;font-size:14px}
#ctrls{position:absolute;inset:auto 0 0 0;height:190px;z-index:4;pointer-events:none;display:none}
#ctrls.on{display:block}
#stick{position:absolute;left:18px;bottom:18px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);pointer-events:auto;touch-action:none}
#nub{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.25)}
#actb{position:absolute;right:22px;bottom:34px;width:96px;height:96px;border-radius:50%;pointer-events:auto;font-weight:700;font-size:18px;background:rgba(143,134,255,.35);border:2px solid var(--acc);touch-action:none}
#chatb{position:absolute;right:130px;bottom:50px;pointer-events:auto;padding:8px 12px;border-radius:20px;font-size:13px;background:rgba(26,22,38,.85)}
#micb{position:absolute;right:130px;bottom:100px;pointer-events:auto;padding:8px 12px;border-radius:20px;font-size:13px;background:rgba(26,22,38,.85)}
#ov{position:fixed;inset:0;background:rgba(5,4,10,.82);z-index:20;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
#ov .card{margin:auto}
#ov.on{display:flex}
#netb{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--bad);color:#fff;text-align:center;padding:5px;font:600 13px system-ui;display:none}
@media (max-width:560px){#chat{width:62%}}
</style>
</head>
<body>
<div id="netb"></div>

<!-- HOME -->
<div id="home" class="scr on"><div class="card col">
 <h1>Moonfall</h1>
 <div class="mut">Four crash survivors, one alien moon, and very limited ways to talk to each other.</div>
 <button class="pri" id="bHost">Host a game (you watch)</button>
 <button id="bJoinShow">Join a game</button>
 <button id="bRejoin" style="display:none"></button>
 <button id="bPractice">Practice offline (control all four yourself)</button>
 <div class="mut" style="font-size:13px">Voice chat works best with headphones. Players hear anyone in the same room.</div>
</div></div>

<!-- JOIN -->
<div id="join" class="scr"><div class="card col">
 <h1>Join a game</h1>
 <label>Your name<input id="jName" maxlength="14" autocomplete="off" placeholder="Name"></label>
 <label>Game code<input id="jCode" maxlength="6" autocomplete="off" placeholder="ABCDE" style="text-transform:uppercase"></label>
 <button class="pri" id="bJoin">Join</button>
 <button id="bJoinBack">Back</button>
 <div id="jMsg" class="mut"></div>
</div></div>

<!-- LOBBY (both host and player) -->
<div id="lobby" class="scr"><div class="card col">
 <h1 id="lTitle">Lobby</h1>
 <div id="lHostBox" class="col" style="display:none">
  <div class="mut">Game code</div><div class="code" id="lCode">-----</div>
  <div class="row"><button id="bCopy">Copy join link</button></div>
  <div class="mut" style="font-size:13px" id="lLink"></div>
 </div>
 <h2>Roles</h2>
 <div class="roles" id="lRoles"></div>
 <div id="lMic" class="mut" style="font-size:13px"></div>
 <button class="pri" id="bStart" style="display:none">Start game</button>
 <div id="lMsg" class="mut"></div>
</div></div>

<!-- GAME -->
<div id="game">
 <div id="views"></div>
 <div id="topbar"></div>
 <div id="toasts"></div>
 <div id="chat"><div id="chatlog"></div><div id="chatin"><input id="chatTxt" maxlength="120" placeholder="Say something (same rules as voice)"><button id="chatSend">Send</button></div></div>
 <div id="ctrls"><div id="stick"><div id="nub"></div></div><button id="actb">USE</button><button id="chatb">Chat</button><button id="micb">Mic on</button></div>
</div>
<div id="ov"></div>

<script>
'use strict';
/* ============================== MAP ============================== */
const R=6,A=10,RR=A*2/Math.sqrt(3);
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];           // E NE NW W SW SE
const DNAME=['east','north-east','north-west','west','south-west','south-east'];
const ANG=[0,-60,-120,180,120,60].map(a=>a*Math.PI/180);
const NX=ANG.map(Math.cos),NY=ANG.map(Math.sin);
const K=(q,r)=>q+','+r, P=k=>k.split(',').map(Number);
const inMap=(q,r)=>Math.abs(q)<=R&&Math.abs(r)<=R&&Math.abs(q+r)<=R;
const CELLS=[];for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)if(inMap(q,r))CELLS.push(K(q,r));
const nb=(k,d)=>{const[q,r]=P(k),n=[q+DIRS[d][0],r+DIRS[d][1]];return inMap(n[0],n[1])?K(n[0],n[1]):null};
const SHIP={'-1,0':1,'0,0':2,'1,0':3};
const ISLORD=['2,-3','3,-4','4,-5','5,-6'];   // the island: 4 rooms in a row, south-west end first (it lies on one straight line from the left ship section)
const ISLAND='3,-4',ISL=new Set(ISLORD);
const LAKE=new Set(CELLS.filter(k=>{const[q,r]=P(k);return !ISL.has(k)&&((r<=-2&&q>=2&&q<5)||(q===1&&r<=-2)||k==='2,-1'||k==='3,-1')}));
ISL.forEach(c=>DIRS.forEach(([a,b])=>{const[q,r]=P(c);if(inMap(q+a,r+b)&&!ISL.has(K(q+a,r+b)))LAKE.add(K(q+a,r+b))}));   // a permanent ring of water on every side of the island (it never drains)
const COLORS=[{n:'red',c:'#ff6b6b'},{n:'blue',c:'#5aa9ff'},{n:'green',c:'#5cd68a'},{n:'yellow',c:'#ffd84d'}];   // east gate: the third clue
const LETTERS=['A','B','C','D'];
const SHAPES=['triangle','square','circle','star'];   // the 4 island buttons, one per island room
const GATE='2,0',KEYP='1,5',PANEL='6,0',DOCK='5,0',BANK='-2,1';   // PANEL: the Engineer's sealed room at the far east end. DOCK: the room just outside, with the door socket — a charged battery sitting there opens the panel door
// Gate-code stage: the Commander hears one role per ship section — Swimmer on the island from the LEFT tile (section 1), Engineer at the device from the MIDDLE tile (section 2), Heavy at the keypad from the RIGHT tile (section 3).
// Battery-array stage: from the LEFT ship tile (section 1) the Commander hears all three at once: PANEL/Engineer (east line), array/Heavy (west line, out on the west bank), island/Swimmer (north-east line).
const RIVER=new Set(['1,1','0,2','-1,3','-1,4','-1,5','-1,6']);
const POND=new Set(['1,2','1,3']);
const LGATE='0,-2',LCHAN=new Set(['-1,-1','-2,-1','-3,-1','-4,-1','-5,-1']);
const DEVICE='0,-5',PUZZLE='-5,0',BAT1='5,-4',POD='6,-5',PORT='-1,1',ROCK='0,1',SLEVER='-1,-1';
const CHAN=new Set(['-2,5','-3,5']),POOL='-4,5',GRL='-5,5',CRYSTAL='-5,6',SGATE='-5,4',SOCK='-5,3';
const FCRY='-3,3';   // the final crystal room, a dead-end pocket off the approach to the grotto
const MOUNT=new Set(['2,4','0,5','0,6','-3,2','-2,2','4,2','-3,-2','-1,2','-4,3']);
[POOL,GRL,CRYSTAL,...CHAN].forEach(c=>{for(let d=0;d<6;d++){const n=nb(c,d);if(n&&![POOL,GRL,CRYSTAL].includes(n)&&!CHAN.has(n)&&!RIVER.has(n)&&n!==SGATE)MOUNT.add(n)}});
['-6,2','-6,3','-1,-2','-1,-5'].forEach(k=>MOUNT.add(k));   // the whole left side is mountains; the Engineer starts in a small maze in the top-left corner. Straight shots stay open along the array row, the device column and the island and keypad lines
const ESPAWN='-3,-3';
const POIS=[ISLAND,CRYSTAL,FCRY,DEVICE,SOCK,GRL,KEYP,PUZZLE,PANEL,DOCK,SLEVER,BAT1,POD];   // shown unlabeled on the Commander's radar while the ship has power
const SLOTS={1:[-7.5,-3.5],2:[-2.5,-3.5],3:[2.5,-3.5],4:[7.5,-3.5],5:[-7.5,4],6:[-2.5,4],7:[2.5,4],8:[7.5,4]};
const CPL=[[-5,-4],[5,-4],[-5,4],[5,4]];   // four pressure plates around the crystal
const HOLD={crystal:[CRYSTAL,0,0],fc:[FCRY,0,0],sock:[SOCK,0,0],d0:[DEVICE,-4,2.5],d1:[DEVICE,4,2.5]};
const HNAME={crystal:'the broken battery',fc:'the crystal',sock:'the grotto gate socket',d0:'the device (left socket)',d1:'the device (right socket)',b0:'the battery',b1:'the battery'};
const ROLES=['C','E','H','S'];
const RN={C:'Commander',E:'Engineer',H:'Heavy',S:'Diver'};
const RC={C:'#8f86ff',E:'#ff7a45',H:'#ff6fa3',S:'#2fc29a'};
const RC0=Object.assign({},RC);const PAL=['#8f86ff','#ff7a45','#ff6fa3','#2fc29a','#ffd23f','#4cc9f0','#b5e48c','#f4f1ea'];
const RDESC={C:'The best communicator',E:'The cleverist student',H:'The dumb one',S:'The best explorer'};

/* ============================== RULES (shared) ============================== */
function terr(k,s){if(!k)return'void';
 if(MOUNT.has(k))return'mount';if(SHIP[k])return'ship';
 if(ISL.has(k))return(s.sv&&!s.lo)?'sunk':'island';
 if(LAKE.has(k))return'lake';
 if(RIVER.has(k)||k===GATE||POND.has(k)||CHAN.has(k)||k===POOL)return s.sv?'bed':'river';   // when the east gate shuts, the river, its pond branch and everything downstream (grotto channel and pool) drain
 if(LCHAN.has(k)||k===LGATE)return s.lo?'river':'bed';
 if(k===SGATE)return'sgate';if(k===POD)return'pod';
 return'land'}
const WET=t=>t==='lake'||t==='river'||t==='sunk';
const shipPowered=s=>s.b.some((b,i)=>b.sl==='pt'&&!b.cr&&chargeAt(s,'b'+i)!=null);   // the ship runs on a charged battery sitting in the ship socket at the crash site
const isSlot=b=>b.sl!=null&&b.sl!=='dk'&&b.sl!=='pt';
const chargeAt=(s,h)=>{const c=s.ch.find(c=>c.at===h);return c?c.id:null};
function flags(s){return{sgOpen:chargeAt(s,'sock')!=null&&s.gg,devLocked:s.da&&!s.sv,walls:(s.da&&!s.sv)||(s.sv&&!s.lo),
 dopen:!!s.dl,
 door:!!s.dl&&!!s.rk,
 pdoor:!!s.lo||s.b.some((b,i)=>b.sl==='dk'&&!b.cr&&chargeAt(s,'b'+i)!=null)}}
function canEnter(s,role,from,to,f){if(!to)return false;f=f||flags(s);const t=terr(to,s);
 if(t==='mount')return false;
 if(from===POD&&(to!==BAT1||s.b[0].home))return false;   // the pod only opens onto the wreck room, and only once the battery is off the hatch
 if(to===POD)return from===BAT1&&(role==='S'||!s.b[0].home);   // once it is open, anyone can step in
 if((to===PANEL||from===PANEL)&&!f.pdoor)return false;   // the Engineer's room is sealed unless a charged battery sits in the door socket
 if(SHIP[to])return SHIP[from]?true:(from===ROCK&&to==='0,0'&&f.door);   // once the door has opened it stays open: anyone can go in or out
 if(SHIP[from])return from==='0,0'&&to===ROCK&&f.door;
 if((from===DEVICE||from===KEYP)&&f.devLocked)return false;   // Engineer at the device and Heavy at the keypad are shut in while the east gate puzzle runs
 if(ISL.has(from)&&!ISL.has(to)&&f.walls)return false;
 if(ISL.has(to))return role==='S'&&(ISL.has(from)||!f.walls);
 if(WET(t))return role==='S';
 if(t==='sgate')return f.sgOpen;
 return true}
function holderPos(s,h){if(h==='b0'||h==='b1'){const b=s.b[+h[1]];return[b.h,b.x,b.y]}return HOLD[h]}
function rays(s){const out=[];const c=s.p.C.h;
 for(let d=0;d<6;d++){let cur=c,n=0,hit=null;
  while(true){cur=nb(cur,d);n++;if(!cur)break;if(SHIP[cur])continue;if(MOUNT.has(cur))break;
   const here=['E','H','S'].filter(r=>s.p[r].h===cur);if(here.length){hit={r:here,d:n,k:cur};break}}
  out.push(hit)}return out}
function action(s,role){const p=s.p[role],here=p.h;
 const dist=(x,y)=>Math.hypot(p.x-x,p.y-y);
 if(role==='E'){let best=null,bd=1e9;
  for(const h of['crystal','fc','sock','d0','d1','b0','b1']){const[hh,x,y]=holderPos(s,h);if(hh!==here)continue;const dd=dist(x,y);if(dd>3.8||dd>=bd)continue;
   const has=chargeAt(s,h)!=null;if(h==='crystal'&&(s.bg||p.cy!=null))continue;if((p.cy==null&&has)||(p.cy!=null&&!has)){best=h;bd=dd}}

  if(!best)return null;
  if(p.cy==null)return{t:'Take the charge from '+HNAME[best],f:()=>{const c=s.ch.find(c=>c.at===best);c.at='E';p.cy=c.id;if(best==='crystal')s.bg=true}};
  return{t:'Pour your charge into '+HNAME[best],f:()=>{s.ch[p.cy].at=best;p.cy=null}}}
 if(role==='H'){
  if(p.cy!=null){const b=s.b[p.cy];
   if(here===PUZZLE&&s.sv&&!s.lo&&s.rv){let best=null,bd=1e9;for(const[sl,[x,y]]of Object.entries(SLOTS)){if(s.b.some(o=>o.sl===sl&&!o.cr))continue;const dd=dist(x,y);if(dd<=3.8&&dd<bd){best=sl;bd=dd}}
    if(best)return{t:'Set the battery into slot '+best,f:()=>{b.cr=0;b.sl=best;b.h=PUZZLE;[b.x,b.y]=SLOTS[best];p.cy=null}}}
   if(here===DOCK&&!s.lo&&!s.b.some(o=>o.sl==='dk'))return{t:'Set the battery into the door socket',f:()=>{b.cr=0;b.sl='dk';b.h=DOCK;b.x=0;b.y=1.2;p.cy=null}};
   if(here===PORT&&!s.b.some(o=>o.sl==='pt'))return{t:'Set the battery into the ship socket',f:()=>{b.cr=0;b.sl='pt';b.h=PORT;b.x=0;b.y=0;p.cy=null}};
   return{t:'Put the battery down',f:()=>{b.cr=0;b.sl=null;b.h=here;b.x=p.x;b.y=Math.min(p.y+1.4,7);p.cy=null}}}
  let bi=-1,bd=1e9;s.b.forEach((b,i)=>{if(b.cr||b.h!==here)return;const dd=dist(b.x,b.y);if(dd<=3.8&&dd<bd){bi=i;bd=dd}});
  if(bi>=0)return{t:s.b[bi].home?'Lift the battery':'Pick up the battery',f:()=>{const b=s.b[bi];b.cr=1;b.sl=null;
   if(b.home){b.home=false;note('The hatch groans.',['H','S'])}p.cy=bi}};


  if(here===ROCK&&!s.rk&&flags(s).dopen&&dist(-4,-6.5)<=4.5)return{t:'Shove the rock',f:()=>{s.rk=true;note('Stone scrapes.',null)}};
  return null}
 if(role==='S'){
  if(ISL.has(here)&&!s.lo){const live=s.sv?s.sol:s.da;
   if(!live)return null;
   if(dist(0,0)>4.5)return null;
   return{t:s.sv?'Press the '+SHAPES[s.bm[here]]+' button':'Press the button',f:()=>pressButton(here)}}
  return null}
 return null}

/* ============================== HOST ENGINE ============================== */
let S=null;                 // authoritative state (host) or latest state (client)
const IN={C:{mx:0,my:0},E:{mx:0,my:0},H:{mx:0,my:0},S:{mx:0,my:0}};
let noteSink=null;
function note(tx,to){if(!S)return;S.msgs.push({id:++S.mid,tx,to:to||null});if(S.msgs.length>14)S.msgs.shift()}
function newTargets(prev){const keys=Object.keys(SLOTS);let t;do{t=shuffle(keys).slice(0,2).sort()}while(prev&&t.join()===prev.join());return t}   // 2 random slots out of 8, never the same pair twice in a row
function popBatteries(){S.b.forEach((b,i)=>{if(b.sl==='dk'||b.sl==='pt')return;b.cr=0;b.sl=null;b.h=PUZZLE;b.x=i?1.3:-1.3;b.y=.25});S.p.H.cy=null}   // batteries pop free of the slots, charge kept
function assignButtons(){const o={};shuffle([0,1,2,3]).forEach((sh,i)=>o[ISLORD[i]]=sh);return o}   // which shape sits in which island room
const isleNo=k=>ISLORD.indexOf(k)+1;   // 1 = south-west end ... 4 = north-east end
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const rndPw=()=>String(1000+Math.floor(Math.random()*9000));
// EAST GATE (5 right in a row): the Engineer's device shows a color; the Heavy's keypad screen shows each island room in a different color; the Diver presses the island button whose color matches. A wrong press sends it back to 0.
function newEast(){const pc=S.ecl;S.eperm=shuffle([0,1,2,3]);const cs=[0,1,2,3].filter(c=>c!==pc);S.ecl=cs[Math.random()*cs.length|0];S.el=ISLORD[S.eperm.indexOf(S.ecl)]}
// WEST GATE (3 rounds, all at once): the Swimmer reads 3 numbers (wc) off the wall carving. Once the array is solved (sol) the Heavy's array shows numbers -> letters (wh) and the Engineer's panel shows letters -> symbols (we). The Swimmer presses the symbols for his numbers, smallest number first (wq).
function newWest(){S.sol=false;S.wp=0;const ns=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4),ls=shuffle([0,1,2,3]);S.wh=ns.map((n,i)=>({n,l:ls[i]}));S.we=shuffle([0,1,2,3]);S.wc=shuffle([0,1,2,3]).slice(0,3);S.wd=Math.random()<.5;
 const nOf=l=>S.wh.find(e=>e.l===l).n;let o=S.wc.slice().sort((x,y)=>nOf(x)-nOf(y));if(S.wd)o.reverse();S.wq=o.map(l=>S.we[l]);S.bm=assignButtons()}
function newState(){return{ph:'play',t:0,won:false,bg:false,out:false,dl:false,cp:[false,false,false,false],
 p:{C:{h:'0,0',x:0,y:2,cy:null},E:{h:ESPAWN,x:0,y:0,cy:null},H:{h:'4,0',x:0,y:0,cy:null},S:{h:POD,x:-2,y:0,cy:null}},
 ch:[{id:0,at:'b1'},{id:1,at:'crystal'}],
 b:[{h:BAT1,x:0,y:0,cr:0,sl:null,home:true},{h:PORT,x:0,y:0,cr:0,sl:'pt',home:false}],
 rk:false,rs:false,da:false,ep:0,eperm:[0,1,2,3],el:null,ecl:null,sv:false,lo:false,tg:newTargets(),rd:0,rv:false,sol:false,wc:[],wd:false,wh:[],we:[],wq:[],wp:0,bm:assignButtons(),gg:false,

function lobbyPayload(){const seats={};ROLES.forEach(r=>{const s=SEATS[r];seats[r]=s?{name:s.name,pid:s.pid,col:s.col,on:!!(CONNS[s.pid]&&CONNS[s.pid].open)}:null});return{t:'lob',seats,code:CODE,ph:S?S.ph:'lobby'}}
function hostLobbyRender(){const L=lobbyPayload();renderRoles(L,null);$('#lCode').textContent=CODE;const link=location.origin+location.pathname+'?join='+CODE;$('#lLink').textContent=link;$('#bCopy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(link).then(()=>toastL('Link copied'))};
 const n=ROLES.filter(r=>SEATS[r]).length;$('#bStart').style.display='block';$('#bStart').textContent=n===4?'Start game':`Start game (${n}/4 players — you can drive empty seats)`}
function toastL(t){$('#lMsg').textContent=t;setTimeout(()=>{if($('#lMsg').textContent===t)$('#lMsg').textContent=''},2500)}
function renderRoles(L,mine){$('#lRoles').innerHTML=ROLES.map(r=>{const s=L.seats[r];return`<button class="role ${mine===r?'mine':''}" data-r="${r}" ${MODE==='host'?'disabled':''}>
 <b style="color:${(s&&s.col)||RC0[r]}">${RN[r]}</b><small>${s?esc(s.name)+(s.on?'':' (offline)'):'Open'}</small><small>${RDESC[r]}</small></button>`}).join('');
 if(MODE==='client'){$('#lRoles').querySelectorAll('.role').forEach(b=>b.onclick=()=>send({t:'pick',r:b.dataset.r}));
  const used=ROLES.filter(x=>x!==mine&&L.seats[x]).map(x=>L.seats[x].col);
  $('#lRoles').insertAdjacentHTML('beforeend',mine?`<div id="lPal" style="grid-column:1/-1;display:flex;gap:8px;justify-content:center;margin-top:6px">${PAL.map(c=>`<button data-c="${c}" style="width:30px;height:30px;border-radius:50%;background:${c};border:${(L.seats[mine]&&L.seats[mine].col)===c?'3px solid #fff':'2px solid rgba(255,255,255,.25)'};opacity:${used.includes(c)?.25:1};padding:0"></button>`).join('')}</div>`:'');
  const pal=$('#lPal');if(pal)pal.querySelectorAll('button').forEach(b=>b.onclick=()=>send({t:'col',c:b.dataset.c}))}}
async function startHost(){MODE='host';show('lobby');$('#lTitle').textContent='Your game';$('#lHostBox').style.display='flex';$('#lMic').textContent='You are the host: you watch and can switch between everyone\'s view. You don\'t play a role.';
 $('#lMsg').textContent='Connecting…';if(!await loadPeer()){$('#lMsg').textContent="Couldn't load the connection library (PeerJS). Check your internet and reload.";return}
 const open=()=>{CODE=rndCode();PEER=new (PeerCtor())(PID(CODE));
  PEER.on('open',()=>{$('#lMsg').textContent='';hostLobbyRender()});
  PEER.on('error',e=>{if(e.type==='unavailable-id'){try{PEER.destroy()}catch(x){}open()}else if(e.type!=='peer-unavailable'){$('#lMsg').textContent='Connection problem: '+e.type}});
  PEER.on('disconnected',()=>{try{PEER.reconnect()}catch(e){}});
  PEER.on('connection',c=>{c.on('open',()=>{CONNS[c.peer]=c;c.send(lobbyPayload())});c.on('data',d=>hostRecv(c,d));c.on('close',()=>{delete CONNS[c.peer];hostDropped(c.peer)})});
  PEER.on('call',call=>{call.answer(silentStream());wireCall(call)})};
 open();$('#bStart').onclick=hostBeginGame}
function hostRecv(c,d){if(!d||!d.t)return;
 if(d.t==='hello'){let p=PLAYERS[d.cid];if(!p)p=PLAYERS[d.cid]={cid:d.cid,role:null};p.name=String(d.name||'Player').slice(0,14);p.pid=c.peer;
  if(p.role&&SEATS[p.role]&&SEATS[p.role].cid===p.cid)SEATS[p.role].pid=c.peer;hostSync();if(S)c.send({t:'go',role:p.role});return}
 const p=Object.values(PLAYERS).find(p=>p.pid===c.peer);if(!p)return;
 if(d.t==='col'&&p.role&&SEATS[p.role]&&PAL.includes(d.c)&&!S){const used=ROLES.filter(x=>x!==p.role&&SEATS[x]).map(x=>SEATS[x].col);if(!used.includes(d.c)){SEATS[p.role].col=d.c;p.col=d.c;hostSync()}return}
 if(d.t==='pick'&&ROLES.includes(d.r)){{const cur=SEATS[d.r];if(cur&&cur.cid!==p.cid){const off=S&&!(CONNS[cur.pid]&&CONNS[cur.pid].open);if(!off)return;const old=PLAYERS[cur.cid];if(old)old.role=null;SEATS[d.r]=null}}if(S&&p.role)return;if(p.role&&SEATS[p.role]&&SEATS[p.role].cid===p.cid)SEATS[p.role]=null;
  p.role=d.r;SEATS[d.r]={cid:p.cid,name:p.name,pid:p.pid,col:freeCol(d.r,p.col)};hostSync();if(S)c.send({t:'go',role:p.role});return}
 if(!S||!p.role)return;
 if(d.t==='in'){IN[p.role]={mx:+d.mx||0,my:+d.my||0}}
 else if(d.t==='act')doAct(p.role);
 else if(d.t==='chat'){const tx=String(d.x||'').slice(0,120);const to=[p.role,...(S.hear[p.role]||[])];bcast({t:'chat',f:p.role,x:tx,to});chatLine(p.role,tx,to)}}
function hostDropped(pid){const p=Object.values(PLAYERS).find(p=>p.pid===pid);if(p&&p.role)IN[p.role]={mx:0,my:0};hostSync()}
function freeCol(r,want){const used=ROLES.filter(x=>x!==r&&SEATS[x]).map(x=>SEATS[x].col);if(want&&PAL.includes(want)&&!used.includes(want))return want;if(!used.includes(RC0[r]))return RC0[r];return PAL.find(c=>!used.includes(c))}
function hostSync(){bcast(lobbyPayload());if(!S)hostLobbyRender();else{S.on={};ROLES.forEach(r=>{const s=SEATS[r];S.on[r]=!!(s&&CONNS[s.pid]&&CONNS[s.pid].open);S.names[r]=s?s.name:''})}}
function hostBeginGame(){S=newState();S.pc={};ROLES.forEach(r=>{S.pc[r]=(SEATS[r]&&SEATS[r].col)||RC0[r]});ROLES.forEach(r=>{const s=SEATS[r];S.names[r]=s?s.name:'';S.on[r]=!!(s&&CONNS[s.pid]&&CONNS[s.pid].open)});
 bcast(lobbyPayload());Object.values(PLAYERS).forEach(p=>{const c=CONNS[p.pid];if(c&&p.role)try{c.send({t:'go',role:p.role})}catch(e){}});
 enterGame();let n=0;setInterval(()=>{tick(.05);if(++n%2===0){S.on=S.on||{};ROLES.forEach(r=>{const s=SEATS[r];S.on[r]=!!(s&&CONNS[s.pid]&&CONNS[s.pid].open)});bcast({t:'s',s:S});updateAudio()}},50)}

/* ---------- client ---------- */
async function startJoin(){const name=$('#jName').value.trim()||'Player',code=$('#jCode').value.trim().toUpperCase();if(code.length<4){$('#jMsg').textContent='Enter the game code.';return}
 try{localStorage.setItem('mf-name',name)}catch(e){}
 MODE='client';CODE=code;$('#jMsg').textContent='Asking for your microphone…';const mic=await getMic();
 $('#jMsg').textContent='Connecting…';if(!await loadPeer()){$('#jMsg').textContent="Couldn't load the connection library (PeerJS).";return}
 NAME=name;makePeer(mic)}
let everOn=false,retryT=null,NAME='Player';
function makePeer(mic){try{if(PEER)PEER.destroy()}catch(e){}
 PEER=new (PeerCtor())();PEER.on('call',call=>{call.answer(MIC);wireCall(call)});
 PEER.on('error',e=>{if(e.type==='peer-unavailable'){if(everOn)scheduleRetry();else if(!HCONN?.open)$('#jMsg').textContent='No game with that code. Check it with the host.'}});
 PEER.on('disconnected',()=>{try{PEER.reconnect()}catch(e){}});
 PEER.on('open',()=>connectHost(NAME,mic))}
function scheduleRetry(){netBanner(true);clearTimeout(retryT);retryT=setTimeout(()=>{if(HCONN&&HCONN.open)return;if(!PEER||PEER.destroyed||PEER.disconnected)makePeer(MIC);else connectHost(NAME,MIC)},2500)}
function connectHost(name,mic){HCONN=PEER.connect(PID(CODE),{reliable:true});
 HCONN.on('open',()=>{everOn=true;netBanner(false);try{localStorage.setItem('mf-last',JSON.stringify({code:CODE,name,cid:CID}))}catch(e){}HCONN.send({t:'hello',cid:CID,name});if(!S){show('lobby');$('#lTitle').textContent='Pick your role';$('#lMic').textContent=mic?'Microphone ready. Headphones recommended.':'No microphone — you can still play using text chat.'}});
 HCONN.on('data',clientRecv);
 HCONN.on('close',scheduleRetry);
 HCONN.on('error',()=>{})}
function clientRecv(d){if(!d||!d.t)return;
 if(d.t==='lob'){LOB=d;const me=Object.entries(d.seats).find(([r,v])=>v&&v.pid===PEER.id);if(!S){renderRoles(d,me?me[0]:null);$('#lMsg').textContent=me?'Waiting for the host to start…':'Tap a role to claim it.'}syncCalls()}
 else if(d.t==='go'){MYROLE=d.role;if(MYROLE&&$('#game').classList.contains('on')===false&&S){enterGame()}if(MYROLE)GO=true}
 else if(d.t==='s'){S=d.s;if(GO&&MYROLE&&!$('#game').classList.contains('on'))enterGame();updateAudio()}
 else if(d.t==='chat'){if(d.to.includes(MYROLE))chatLine(d.f,d.x,d.to)}}
let GO=false;

/* ---------- offline ---------- */
function startOffline(){MODE='offline';S=newState();ROLES.forEach(r=>{S.names[r]='';S.on[r]=false});VIEW='quad';enterGame();
 setInterval(()=>tick(.05),50);toast('Practice mode: pick a view at the top to drive that character. "All 4" shows everyone.',9000)}

let gameStarted=false;
function enterGame(){show('game');buildViews();$('#chat').style.display=MODE==='offline'?'none':'flex';$('#chatb').style.display=MODE==='client'?'block':'none';$('#micb').style.display=MODE==='client'?'block':'none';$('#chat').style.bottom=(isTouch&&controlledRole()?200:64)+'px';
 if(!gameStarted){gameStarted=true;requestAnimationFrame(frame);if(MODE==='client')setTimeout(helpOv,300)}}

/* ---------- home wiring ---------- */
$('#bHost').onclick=startHost;
$('#bPractice').onclick=startOffline;
$('#bJoinShow').onclick=()=>show('join');$('#bJoinBack').onclick=()=>show('home');$('#bJoin').onclick=startJoin;
try{$('#jName').value=localStorage.getItem('mf-name')||''}catch(e){}
try{const L=JSON.parse(localStorage.getItem('mf-last')||'null');if(L&&L.code){const b=$('#bRejoin');b.style.display='block';b.textContent='Rejoin game '+L.code;b.onclick=()=>{CID=L.cid;try{sessionStorage.setItem('mf-cid',CID)}catch(e){}$('#jName').value=L.name||'Player';$('#jCode').value=L.code;startJoin()}}}catch(e){}
const qj=new URLSearchParams(location.search).get('join');if(qj){$('#jCode').value=qj.toUpperCase();show('join')}
window.__mf={get S(){return S},IN,doAct,tick,newState,setS:v=>S=v,flags,canEnter,terr,action,rays};
</script>
